name: Hourly layout regression
on:
  push:
    branches: [codex/severe-daily-baseline]
    paths: ['assets/hourly-grid.js', '.github/workflows/hourly-layout.yml']
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node tools/site-sweep-check.js /tmp/hourly-layout blend.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hourly-layout-review
          path: /tmp/hourly-layout
