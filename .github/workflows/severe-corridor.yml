name: Severe Day 1 tornado corridor experiment (research)
# Research only (research/severe/corridor/rules.json, locked before fitting). gate: nested month-held-
# out comparison of arms a/b/c on the 96 2022-23 development dates (extraction run 44577990940).
# diag2024: the all-96 fits of b and c on the 323 NadoCast benchmark days (diagnostic only).
# 2021 is not loaded here; 2025 is never loaded. Nothing touches the live feed, publisher, registry
# or RRFS/NBM collector.
on:
  push:
    branches: [claude/severe-phase2-training]
    paths: ['research/severe/corridor/request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: severe-corridor
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/severe/requirements.txt scikit-learn==1.9.1 matplotlib==3.11.2 shapely==2.2.0
      - uses: actions/download-artifact@v4
        with:
          pattern: severe-conus-*
          merge-multiple: true
          path: tests/out/x
          run-id: 44577990940
          github-token: ${{ github.token }}
      - name: Nested gate (2022-23 only)
        run: |
          mkdir -p tests/out/dev
          for d in tests/out/x/conus/2022-* tests/out/x/conus/2023-*; do ln -s "$PWD/$d" tests/out/dev/; done
          ls tests/out/dev | wc -l
          PYTHONPATH=tools/severe python3 tools/severe/corridor.py gate --conus tests/out/dev --output tests/out/corridor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corridor-gate
          path: tests/out/corridor
          retention-days: 90
  diag2024:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/severe/requirements.txt scikit-learn==1.9.1 matplotlib==3.11.2 shapely==2.2.0
      - uses: actions/download-artifact@v4
        with:
          name: corridor-gate
          path: tests/out/gate
      - uses: actions/download-artifact@v4
        with:
          name: nadocast-score
          path: tests/out/prev
          run-id: 44961880902
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: severe-conus-*
          merge-multiple: true
          path: tests/out/x
          run-id: 44942885255
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: severe-conus-*
          merge-multiple: true
          path: tests/out/x2
          run-id: 44961446546
          github-token: ${{ github.token }}
      - name: 2024 diagnostic (never deciding)
        run: |
          for d in tests/out/x2/conus/*/; do rm -rf "tests/out/x/conus/$(basename "$d")"; cp -r "$d" tests/out/x/conus/; done
          PYTHONPATH=tools/severe python3 tools/severe/corridor.py diag2024 --conus tests/out/x/conus \
            --arrays tests/out/prev/score-arrays.npz --fits tests/out/gate/fits-all96.json --output tests/out/diag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corridor-diag2024
          path: tests/out/diag
          retention-days: 90
  commit:
    needs: [gate, diag2024]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: corridor-*
          path: tests/out/a
      - name: Commit scorecards, fits and maps (not the arrays)
        run: |
          dest=research/severe/corridor/gate
          mkdir -p "$dest"
          find tests/out/a -name '*.json' -exec cp {} "$dest"/ \;
          find tests/out/a -name '*.png' -exec cp {} "$dest"/ \;
          echo "run_id: $GITHUB_RUN_ID" > "$dest/run.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "Corridor experiment gate (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 10; done
          exit 1
