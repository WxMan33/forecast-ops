# Beta previews: checks that the public preview links open for someone who is not signed in, and refreshes
# the review screenshots in docs/beta/screens. Runs only for the beta branch; the live site (main) is untouched.
name: Beta preview check
on:
  push:
    branches: [beta-previews]
    paths-ignore: ["docs/beta/screens/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: beta-preview, cancel-in-progress: true }
jobs:
  preview:
    runs-on: ubuntu-latest
    # the preview host can take up to 20 minutes to serve a new commit, and the signed-out check itself takes about 12
    timeout-minutes: 45
    env:
      BASE: https://raw.githack.com/${{ github.repository }}/${{ github.ref_name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/beta-story.test.js && node tests/beta-analytics.test.js && node tests/event-store.test.js && node tests/event-times.test.js && node tests/event-backup.test.js && node tests/hourly-model.test.js && node tests/calendar-provider.test.js && node tests/venue-search.test.js && node tests/climate-report.test.js && node tests/climate-station.test.js && node tests/weather-history.test.js
      # system packages come from the Ubuntu mirrors; when the runner can't reach them, install the browser alone
      # (the runner image already carries Chromium's libraries) and say so, rather than skipping every check
      - run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium || { echo "::warning::Ubuntu packages for Chromium could not be installed; installing the browser alone"; npx playwright install chromium; }
      - name: Network recorder self-test (offline, bounded)
        run: node tools/net-recorder-check.js
      - name: Hourly grid fixtures (offline; ordinary, overnight, overlapping, multi-day, DST, missing data; phone and desktop, both themes)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://localhost:8765/ >/dev/null && break; sleep 0.5; done
          mkdir -p /tmp/hourly && node tools/hourly-grid-check.js http://localhost:8765/ /tmp/hourly
      - name: Documentary weather history regression
        run: node tools/weather-history-check.js
      - name: Almanac station-aware NWS refresh regression
        run: node tools/almanac-refresh-check.js
      - name: Wait until the preview host serves this commit (pages and scripts)
        run: |
          STAMP=$(grep -o 'beta-ui.js?v=[0-9a-f]*' event-beta.html | head -1)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # raw.githack.com caches each file by path (it ignores ?v=), so check every file the betas load
          FILES="meteorologist-beta.html event-beta.html maps.html almanac.html blend.html assets/climate-station.js assets/almanac.js assets/climate-report.js assets/climate-report.css assets/cincinnati-weather-history.js assets/history/cincinnati-flood-1913-bain.jpg assets/record-watch.js assets/beta-analytics.js assets/beta-config.js assets/beta-ui.js assets/beta-story.js assets/beta-met.js assets/beta-event.js assets/event-store.js assets/beta-upcoming.js assets/calendar-import.js assets/venue-search.js assets/hourly-model.js assets/hourly-views.js assets/hourly-grid.js assets/hourly-grid.css assets/blend.js assets/ops-core.js assets/beta.css assets/maps.js assets/ops.js assets/ops.css"
          for i in $(seq 1 40); do
            stale=""
            # -L: the host redirects some files (images) to raw.githubusercontent.com; compare what a browser receives
            for f in $FILES; do [ "$(curl -fsSL "${BASE}$f" | sha256sum | cut -c1-16)" = "$(sha256sum "$f" | cut -c1-16)" ] || stale="$stale $f"; done
            if [ -z "$stale" ]; then echo "preview current"; exit 0; fi
            echo "waiting for:$stale"; sleep 30
          done
          echo "::warning::preview host still stale after 20 minutes:$stale"
      - name: Signed-out check and screenshots
        run: mkdir -p docs/beta/screens && node tools/beta-preview-check.js "$BASE" docs/beta/screens "$STAMP"
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/beta/screens
          git diff --cached --quiet && exit 0
          git commit -m "Beta preview screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push && exit 0; sleep 5; done; exit 1

  # The dedicated Google Calendar beta origin (Cloudflare Pages builds the beta-previews branch on its own).
  pages:
    name: Cloudflare Pages calendar origin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAGES: https://forecast-ops-beta.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # system packages come from the Ubuntu mirrors; when the runner can't reach them, install the browser alone
      # (the runner image already carries Chromium's libraries) and say so, rather than skipping every check
      - run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium || { echo "::warning::Ubuntu packages for Chromium could not be installed; installing the browser alone"; npx playwright install chromium; }
      - name: Wait until Cloudflare serves this commit
        run: |
          for i in $(seq 1 36); do
            stale=""
            for f in almanac.html assets/almanac.js assets/climate-report.js assets/climate-report.css assets/cincinnati-weather-history.js assets/history/cincinnati-flood-1913-bain.jpg event-beta.html assets/event-store.js assets/beta-upcoming.js assets/hourly-model.js assets/hourly-views.js assets/hourly-grid.js assets/hourly-grid.css assets/beta-config.js assets/calendar-import.js assets/venue-search.js assets/beta-analytics.js assets/ops.js; do [ "$(curl -fsSL "${PAGES}$f" | sha256sum | cut -c1-16)" = "$(sha256sum "$f" | cut -c1-16)" ] || stale="$stale $f"; done
            if [ -z "$stale" ]; then echo "Cloudflare Pages current"; exit 0; fi
            echo "waiting for:$stale"; sleep 30
          done
          echo "::error::Cloudflare Pages did not serve this commit within 18 minutes:$stale"; exit 1
      - name: Live calendar origin check (no sign-in)
        run: mkdir -p docs/beta/screens && node tools/pages-check.js "$PAGES" docs/beta/screens
