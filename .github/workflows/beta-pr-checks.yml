# Offline checks for pull requests into the beta branch: unit tests and deterministic browser checks against
# simulated or recorded data. Read-only: it commits nothing and never touches the live sites.
name: Beta pull request checks
on:
  pull_request:
    branches: [beta-previews, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Unit tests
        run: |
          for t in calendar-provider forecast-support core fixtures source-failure forecast-cache beta-story beta-analytics event-store event-times event-backup event-daylight hourly-model event-presets event-briefing-history event-ops-handoff event-briefing-ui almanac climate-report climate-daily climate-period-records climate-station weather-history; do
            echo "::group::$t"; node tests/$t.test.js || { echo "::error::$t failed"; exit 1; }; echo "::endgroup::"
          done
      - run: node tools/stamp-assets.js --check
      - run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Calendar main-origin connection and paged tables (offline)
        run: node tools/calendar-main-check.js
      - name: Missing, failed and delayed sources (simulated network; Event Manager and Model Blend)
        run: node tools/source-failure-check.js /tmp/source-failure
      - name: Location switches on Thunder, Severe and Winter (simulated network; slow A/fast B, failed B/late A, loading, partial, rapid settings)
        run: node tools/location-race-check.js
      - name: Forecast reuse across pages (simulated network; walk, expiry, failed refresh, recovery, location change, full storage)
        run: node tools/navigation-cache-check.js
      - name: Event briefing phone, themes and two-page print (offline)
        run: node tools/event-briefing-polish-check.js
      - name: Event attention tracks and two-page print scenarios (offline)
        run: (command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)) && node tools/event-attention-check.js /tmp/event-attention
      - name: Event Manager HTTP 429 recovery (mocked providers)
        run: node tools/event-429-recovery-check.js /tmp/event-429-recovery.json
      - name: Event Manager dashboard layout (Orlando design case, quiet, partly covered, overnight, missing hour; phone and desktop)
        run: |
          node tools/build-event-sample.js && git diff --exit-code docs/beta/event-sample.html
          node tools/event-dashboard-check.js /tmp/event-dashboard
          node tools/event-hourly-charts-check.js /tmp/event-hourly-charts
          node tests/event-outlook.test.js && node tools/event-outlook-check.js /tmp/event-outlook
          node tools/event-share-check.js /tmp/event-share
          node tools/event-workspace-check.js /tmp/event-workspace
          node tools/event-daylight-check.js /tmp/event-daylight
          node tools/event-map-check.js /tmp/event-map
      - name: Hourly grid fixtures (offline)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://localhost:8765/ >/dev/null && break; sleep 0.5; done
          mkdir -p /tmp/hourly && node tools/hourly-grid-check.js http://localhost:8765/ /tmp/hourly
      - name: Almanac station-aware NWS refresh regression
        run: node tools/almanac-refresh-check.js
      - name: Almanac daily reports (morning, interim, correction, failed refresh, rollover, time zones)
        run: node tools/almanac-daily-check.js /tmp/almanac-daily
      - name: Whole-site layout sweep (every page; phone and desktop; light and dark; simulated network)
        run: node tools/site-sweep-check.js /tmp/site-sweep
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-check-screens
          path: |
            /tmp/source-failure
            /tmp/almanac-daily
            /tmp/site-sweep
            docs/beta/screens/event-polish-*
          if-no-files-found: ignore
