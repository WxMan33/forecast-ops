name: Event briefing visual check
on:
  push:
    branches: [polish-event-briefing, event-variable-charts, event-briefing-history]
    paths-ignore: ["docs/beta/screens/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright@1.48.2 && npx playwright install chromium
      - run: node tests/event-briefing-history.test.js && node tests/event-ops-handoff.test.js && node tests/event-briefing-ui.test.js && node tests/event-hourly-charts.test.js && node tests/hourly-model.test.js && node tools/event-briefing-polish-check.js && (command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)) && node tools/event-attention-check.js /tmp/event-attention && node tools/event-429-recovery-check.js /tmp/event-429-recovery.json && node tools/event-dashboard-check.js /tmp/event-dashboard && node tools/event-hourly-charts-check.js /tmp/event-hourly-charts && node tests/event-outlook.test.js && node tools/event-outlook-check.js /tmp/event-outlook && node tools/event-share-check.js /tmp/event-share && node tools/event-workspace-check.js /tmp/event-workspace && node tests/event-daylight.test.js && node tools/event-daylight-check.js /tmp/event-daylight
      - name: Shared hourly grid regressions
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          mkdir -p /tmp/hourly
          node tools/hourly-grid-check.js http://localhost:8765/ /tmp/hourly
      - name: Save visual proofs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/beta/screens/event-polish-*
          git diff --cached --quiet && exit 0
          git commit -m "Event briefing visual proofs [skip ci]"
          git push
