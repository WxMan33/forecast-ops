name: Severe daily research baseline
on:
  push:
    branches: [codex/severe-daily-baseline]
    paths:
      - 'tools/severe/train_daily.py'
      - '.github/workflows/severe-daily-baseline.yml'
      - 'tools/severe/replay_daily.py'
      - 'tools/severe/replay_daily.html'
      - 'tests/severe-daily-replay-browser.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the 36 pinned v05 cases (private archive, else original run; verified)
        env:
          ARCHIVE_REPO: ${{ vars.SEVERE_REBUILD_ARCHIVE_REPO }}
          ARCHIVE_TOKEN: ${{ secrets.SEVERE_REBUILD_ARCHIVE_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: bash tools/severe/restore_inputs.sh --source v05 --output tests/out/daily-baseline-history
      - run: pip install numpy==2.3.5 scipy==1.17.0
      - name: Fit, calibrate and score daily baselines
        run: python tools/severe/train_daily.py --history tests/out/daily-baseline-history --output tests/out/daily-baseline
      - name: Export checked Day 1 wind replays
        run: python tools/severe/replay_daily.py --history tests/out/daily-baseline-history --output tests/out/daily-replay --cache tests/out/report-cache
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Check replay controls and rendering
        run: python tests/severe-daily-replay-browser.py tests/out/daily-replay
      - uses: actions/upload-artifact@v4
        with:
          name: severe-replay-review-screens
          path: tests/out/wind-replay-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: severe-day1-wind-replay
          path: tests/out/daily-replay
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: severe-daily-research-baseline
          path: tests/out/daily-baseline
          if-no-files-found: error
          retention-days: 30
