name: Severe archive inputs
# Copies one run's research artifacts to a durable GitHub Release before they expire.
# Run it manually. Without a release tag it only downloads, checks and reports; with one it
# also publishes. A Release in this repository is PUBLIC when the repository is public.
#  1. Download every artifact zip from the run and check it against GitHub's own digest.
#  2. If research/severe/archives/run-<id>.json is committed, check every entry against it.
#  3. Upload the manifest (with release_tag filled in) for review and commit.
#  4. Optionally create the Release, upload the zips, and re-download them all through
#     tools/severe/fetch_archive.py --source release to prove the copies verify.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Actions run whose artifacts to archive'
        type: choice
        options: ['42321856909', '43901185832']
      release_tag:
        description: 'Release tag to publish to (blank = check only, publish nothing)'
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: severe-archive-inputs-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download every artifact zip from the run
        run: |
          mkdir -p tests/out/archive/zips
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[]' -c > tests/out/archive/artifacts.jsonl
          echo "Listed $(wc -l < tests/out/archive/artifacts.jsonl) artifacts"
          jq -r '[.id, .name] | @tsv' tests/out/archive/artifacts.jsonl | while IFS=$'\t' read -r id name; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "tests/out/archive/zips/$name.zip"
          done
      - name: Build the manifest and check it against GitHub and the committed copy
        working-directory: tools/severe
        run: |
          python3 archive_manifest.py --run-id "$RUN_ID" --repository "$GITHUB_REPOSITORY" \
            --artifacts ../../tests/out/archive/artifacts.jsonl --zips ../../tests/out/archive/zips \
            --committed "../../research/severe/archives/run-$RUN_ID.json" ${TAG:+--release-tag "$TAG"} \
            --output "../../tests/out/archive/run-$RUN_ID.json"
      - uses: actions/upload-artifact@v4
        with:
          name: severe-archive-manifest-${{ inputs.run_id }}
          path: tests/out/archive/run-${{ inputs.run_id }}.json
          retention-days: 90
      - name: Publish the Release
        if: inputs.release_tag != ''
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; choose a new tag rather than replacing assets"; exit 1
          fi
          gh release create "$TAG" --title "Severe research inputs from run $RUN_ID" --notes \
            "HRRR-derived predictors, NCEI-derived labels, manifests and models from Actions run $RUN_ID. No raw GRIB. Each zip's SHA-256 is pinned in research/severe/archives/run-$RUN_ID.json."
          gh release upload "$TAG" tests/out/archive/zips/*.zip "tests/out/archive/run-$RUN_ID.json"
      - name: Re-download every asset from the Release and verify it
        if: inputs.release_tag != ''
        run: python3 tools/severe/fetch_archive.py --manifest "tests/out/archive/run-$RUN_ID.json" --pattern '*' --source release --dest tests/out/archive/verify
