name: Severe fixed tree-model experiment
on:
  push:
    branches: [codex/severe-daily-baseline]
    paths: ['research/severe/tree-experiment-v08.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: severe-tree-experiment
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Retrieve the complete paginated case archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43901185832 --repo "$GITHUB_REPOSITORY" --pattern 'severe-history-v07-*' --dir tests/out/tree-history
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '43901185832'
          name: severe-labels-v07
          path: tests/out/tree-labels
      - run: python tools/severe/train_trees.py --history tests/out/tree-history --labels tests/out/tree-labels --output tests/out/tree-candidate
      - run: python tools/severe/compare_daily.py --original research/severe/baseline-v07/development-scores.json --candidate tests/out/tree-candidate/development-scores.json --output tests/out/tree-candidate/comparison.json
      - run: pip freeze > tests/out/tree-candidate/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: severe-tree-candidate-v08
          path: tests/out/tree-candidate
          if-no-files-found: warn
          retention-days: 90
