name: Severe CONUS research preview feed (research)
# Builds the static CONUS Day 2 damaging-wind preview feed from the frozen CONUS boosted-tree
# candidate and pushes it to the preview branch named in the request. Replays use archived 2024
# extraction outputs; the current run (optional) is a fresh audited HRRR extraction without labels.
# Never touches main, the live Severe feed, the publisher, the registry or the RRFS/NBM collector.
on:
  push:
    branches: [claude/severe-phase2-training]
    paths: ['research/severe/conus-preview/request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: severe-conus-preview
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.r.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: echo "stage=$(jq -r '.stage // "feed"' research/severe/conus-preview/request.json)" >> "$GITHUB_OUTPUT"
  reports:
    # Original qualifying Storm Events wind records for each replay (pinned 2024 source, scoring window and filter).
    needs: plan
    if: needs.plan.outputs.stage == 'reports'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/severe/requirements.txt scikit-learn==1.9.1 shapely==2.2.0
      - name: Stage the pinned 2024 Storm Events file (verified by size and SHA-256)
        env:
          ARCHIVE_TOKEN: ${{ secrets.SEVERE_REBUILD_ARCHIVE_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          ARCHIVE_REPO: ${{ vars.SEVERE_REBUILD_ARCHIVE_REPO }}
        run: |
          name=$(python3 -c "import json;print([s['file'] for s in json.load(open('research/severe/labels-v04/manifest.json'))['sources'] if '_d2024' in s['file']][0])")
          args=(--name "$name" --cache tests/out/source --actions)
          [ -n "$ARCHIVE_REPO" ] && args+=(--repository "$ARCHIVE_REPO")
          python3 tools/severe/stage_report_source.py "${args[@]}"
      - name: Build report files against the published feed
        run: |
          branch=$(jq -r .preview_branch research/severe/conus-preview/request.json)
          git fetch -q origin "$branch"
          git worktree add -q ../preview "origin/$branch"
          PYTHONPATH=tools/severe python3 tools/severe/conus_preview_build.py reports --feed ../preview/assets/severe-conus --source tests/out/source
          ls -la ../preview/assets/severe-conus
          mkdir -p tests/out/reports-feed && cp ../preview/assets/severe-conus/index.json ../preview/assets/severe-conus/reports-*.json tests/out/reports-feed/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-reports
          path: tests/out/reports-feed
          retention-days: 30
      - name: Push to the preview branch
        run: |
          branch=$(jq -r .preview_branch research/severe/conus-preview/request.json)
          cd ../preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/severe-conus
          git commit -q -m "CONUS research preview: original Storm Events report records for replays (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3; do git push origin "HEAD:$branch" && exit 0; git pull -q --rebase origin "$branch"; sleep 5; done
          exit 1
  current:
    needs: plan
    if: needs.plan.outputs.stage != 'reports'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/severe/requirements.txt scikit-learn==1.9.1 shapely==2.2.0
      - name: Current audited HRRR extraction + frozen model (no labels)
        run: |
          mkdir -p tests/out/current
          want=$(jq -r .current_issue_date research/severe/conus-preview/request.json)
          # "auto": today's 12Z run if all of f24-48 is out, else yesterday's (its Day 2 window is still current).
          if [ "$want" = auto ]; then days="$(date -u +%F) $(date -u -d yesterday +%F)"; else days="$want"; fi
          rm -f tests/out/current/blocker.txt
          for day in $days; do
            rm -rf tests/out/cwork
            if PYTHONPATH=tools/severe python3 tools/severe/conus_preview_build.py current --issue-date "$day" \
                 --work tests/out/cwork --output "tests/out/current/current-$day.json" > tests/out/current/log.txt 2>&1; then
              echo "current run built for $day"; rm -f tests/out/current/blocker.txt; break
            fi
            echo "issue date $day not available:"; tail -c 600 tests/out/current/log.txt
            tail -c 1500 tests/out/current/log.txt > tests/out/current/blocker.txt
          done
          tail -5 tests/out/current/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-current
          path: tests/out/current
          retention-days: 30
  build:
    needs: [plan, current]
    if: always() && needs.plan.outputs.stage != 'reports'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/severe/requirements.txt scikit-learn==1.9.1 shapely==2.2.0
      - uses: actions/download-artifact@v4
        with:
          pattern: severe-conus-*
          merge-multiple: true
          path: tests/out/cohort
          run-id: 44577990940
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: severe-conus-*
          merge-multiple: true
          path: tests/out/x
          run-id: 44942885255
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: severe-conus-*
          merge-multiple: true
          path: tests/out/x2
          run-id: 44961446546
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: preview-current
          path: tests/out/current
      - name: Build the preview feed
        run: |
          for d in tests/out/x2/conus/*/; do rm -rf "tests/out/x/conus/$(basename "$d")"; cp -r "$d" tests/out/x/conus/; done
          cur=$(ls tests/out/current/current-*.json 2>/dev/null | head -1 || true)
          PYTHONPATH=tools/severe python3 tools/severe/conus_preview_build.py build --conus tests/out/x/conus \
            --cohort tests/out/cohort/conus ${cur:+--current "$cur"} --current-blocker tests/out/current/blocker.txt \
            --output tests/out/feed
          ls -la tests/out/feed
      - name: Stage the pinned 2024 Storm Events file (report records for replays)
        env:
          ARCHIVE_TOKEN: ${{ secrets.SEVERE_REBUILD_ARCHIVE_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          ARCHIVE_REPO: ${{ vars.SEVERE_REBUILD_ARCHIVE_REPO }}
        run: |
          name=$(python3 -c "import json;print([s['file'] for s in json.load(open('research/severe/labels-v04/manifest.json'))['sources'] if '_d2024' in s['file']][0])")
          args=(--name "$name" --cache tests/out/source --actions)
          [ -n "$ARCHIVE_REPO" ] && args+=(--repository "$ARCHIVE_REPO")
          python3 tools/severe/stage_report_source.py "${args[@]}"
      - name: Storm report records for the replays (must reproduce the scored report samples)
        run: PYTHONPATH=tools/severe python3 tools/severe/conus_preview_build.py reports --feed tests/out/feed --source tests/out/source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-feed
          path: tests/out/feed
          retention-days: 30
      - name: Push the feed to the preview branch
        run: |
          branch=$(jq -r .preview_branch research/severe/conus-preview/request.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "$branch"
          git worktree add -q ../preview "origin/$branch"
          mkdir -p ../preview/assets/severe-conus
          rm -f ../preview/assets/severe-conus/*.json
          cp tests/out/feed/*.json ../preview/assets/severe-conus/
          cd ../preview
          # Rebuild the phone-safe display contours for the new cases (the viewer refuses stale ones on phones).
          rm -f assets/severe-conus-display/*.json
          python3 tools/build-conus-display.py
          git add assets/severe-conus assets/severe-conus-display
          git commit -q -m "CONUS research preview feed (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3; do git push origin "HEAD:$branch" && exit 0; git pull -q --rebase origin "$branch"; sleep 5; done
          exit 1
