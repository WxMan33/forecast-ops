name: Severe CONUS retrospective RRFS pilot reproducibility (research)
# research/severe/conus-v1/rrfs/retro/REPRODUCIBILITY.md: rerun the first comparison in two pinned and two unpinned
# jobs and compare prediction/coefficient fingerprints. Development only; 2025 never loaded; nothing live touched.
on:
  push:
    branches: [claude/severe-phase2-training]
    paths: ['research/severe/conus-v1/rrfs/retro/repro-request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: severe-conus-rrfs-retro
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job: [pinned-1, pinned-2, unpinned-1, unpinned-2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 shapely==2.2.0
      - id: req
        run: echo "run=$(jq -r .cache_run research/severe/conus-v1/rrfs/retro/repro-request.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { name: rrfs-retro-cache, path: tests/out/cache, run-id: '${{ steps.req.outputs.run }}', github-token: '${{ github.token }}' }
      - name: Rerun the first comparison (${{ matrix.job }})
        run: |
          if [[ "${{ matrix.job }}" == pinned-* ]]; then
            export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 OPENBLAS_CORETYPE=Haswell
            export NPY_DISABLE_CPU_FEATURES="AVX512F AVX512CD AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL AVX512_SPR"
          else
            export OPENBLAS_NUM_THREADS=4 OMP_NUM_THREADS=4
          fi
          grep -m1 "model name" /proc/cpuinfo
          PYTHONPATH=tools/severe python3 tools/severe/conus_rrfs_pilot.py score --cache tests/out/cache --cycle 12 --experiment first --output tests/out/score/${{ matrix.job }} > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.job }}
          path: tests/out/score
          retention-days: 90
  compare:
    needs: score
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'repro-*', merge-multiple: true, path: tests/out/score }
      - name: Compare fingerprints and commit
        env:
          DEST: research/severe/conus-v1/rrfs/retro/repro
        run: |
          mkdir -p "$DEST"
          PYTHONPATH=tools/severe python3 tools/severe/conus_rrfs_repro.py --input tests/out/score \
            --reference research/severe/conus-v1/rrfs/retro/first/scorecard.json --output "$DEST"
          for j in tests/out/score/*/; do cp "$j/scorecard.json" "$DEST/scorecard-$(basename "$j").json"; done
          echo "run_id: $GITHUB_RUN_ID" > "$DEST/run.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Retrospective RRFS pilot: reproducibility check (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && exit 0; sleep $((i*15)); done
          exit 1
