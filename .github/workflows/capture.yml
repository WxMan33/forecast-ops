# Captures real NWS and Open-Meteo responses into tests/fixtures/ for regression tests.
# Run on demand (Actions tab -> Capture fixtures -> Run workflow) or when capture.js changes.
name: Capture fixtures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tests/capture.js", "tests/capture-almanac.js"]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/capture.js
      - run: node tests/capture-almanac.js
      - name: Commit fixtures
        run: |
          git config user.name "forecast-ops capture"
          git config user.email "actions@users.noreply.github.com"
          git add tests/fixtures
          git diff --cached --quiet || git commit -m "Capture real API fixtures [skip ci]"
          git push
