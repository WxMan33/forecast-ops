<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Almanac</title>
<meta name="description" content="Daily almanac: sun and moon, Cincinnati daily climate, weather numbers and notes.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
<link rel="stylesheet" href="assets/ops.css">
</head>
<body class="almanac-page">
<main class="workspace single almanac">
  <div class="main">
    <section class="card almhead">
      <div class="almhead-top">
        <div>
          <span class="kick">Daily almanac</span>
          <h1 class="almtitle" id="sheetTitle">—</h1>
        </div>
        <div class="datenav noprint" role="group" aria-label="Sheet date">
          <button class="btn ghost sm" id="prevDay" type="button" aria-label="Previous day">◀</button>
          <input class="input mono" type="date" id="almDate" aria-label="Sheet date">
          <button class="btn ghost sm" id="nextDay" type="button" aria-label="Next day">▶</button>
          <button class="btn sm" id="todayBtn" type="button">TODAY</button>
        </div>
      </div>
      <div class="almlocs">
        <span><span class="kick">Sun and moon</span> <b id="astroName" class="printonly">—</b>
          <select class="input inline noprint" id="astroPoint" aria-label="Astronomy location">
            <option value="noaa">Cincinnati (NOAA table point)</option><option value="cvg">CVG airport</option><option value="loc">Your selected location</option></select></span>
        <span><span class="kick">Climate</span> <b>Cincinnati</b> <span class="msg">(CVG airport observations · city record since 1871)</span></span>
        <button class="infobtn noprint" id="srcBtn" type="button" aria-expanded="false" aria-controls="srcPanel">ⓘ Source details</button>
      </div>
      <div class="infopanel" id="srcPanel" hidden></div>
    </section>
    <div class="almtop">
      <div class="almcol">
        <section class="card" id="sunCard"><div class="section-title">Sun and moon</div><div class="state loading">Loading…</div></section>
        <section class="card" id="notesCard">
          <div class="row" style="justify-content:space-between;align-items:baseline"><div class="section-title" style="margin:0;flex:none">Notes</div><span class="msg" id="notesState" style="flex:none"></span></div>
          <p class="msg noprint" style="margin:4px 0 8px">Your notes for this date. Saved in this browser only, apart from the sourced values.</p>
          <textarea class="input notes noprint" id="notes" rows="5" aria-label="Notes for this date"></textarea>
          <div class="printnotes" id="printNotes"></div>
        </section>
      </div>
      <section class="card" id="climCard"><div class="section-title">Daily climate</div><div class="state loading">Loading…</div></section>
    </div>
    <section class="card" id="factCard"><div class="section-title">Weather numbers</div><div class="state loading">Loading…</div></section>
  </div>
</main>
<script src="assets/ops-core.js"></script>
<script src="assets/ops-data.js"></script>
<script src="assets/ops.js"></script>
<script src="assets/almanac-core.js"></script>
<script src="assets/almanac.js"></script>
</body>
</html>
