      document.body.insertBefore(b, document.body.firstChild); };
    if (document.body) go(); else document.addEventListener("DOMContentLoaded", go); }
  window.addEventListener("error", function (e) { var t = e.target;
    if (t && (t.tagName === "SCRIPT" || (t.tagName === "LINK" && t.rel === "stylesheet")) && (t.src || t.href || "").indexOf(location.origin) === 0) show("A site file (" + (t.src || t.href).split("/").pop().split("?")[0] + ") could not be downloaded.");

  }, true);

<style>
  .vwrap { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  .vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .slots { display: flex; flex-wrap: wrap; gap: 3px; }
  .slot { width: 14px; height: 14px; border-radius: 3px; background: var(--raised); border: 1px solid var(--line); }
  .slot.on_time { background: var(--normal); } .slot.late { background: var(--monitor); } .slot.off_schedule { background: var(--prepare); }
  .slot.missed, .slot.failed { background: var(--action); } .slot.pending { background: transparent; border-style: dashed; }
  .ev { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .ev img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  .ev pre { white-space: pre-wrap; font-size: 12px; max-height: 360px; overflow: auto; background: var(--raised); padding: 8px; border-radius: 8px; }
  @media (max-width: 760px) { .ev { grid-template-columns: 1fr; } }
  td.bad { color: var(--action); } td.warn { color: var(--monitor); }
  .vtabs { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
<link rel="stylesheet" href="assets/verify-dashboard.css?v=7bacc29887">
</head>
<body>
<main class="vwrap">
  <section class="card">
    <div class="row" style="justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
      <div class="section-title" style="margin:0">CVG forecast verification</div>
      <a class="msg" href="index.html">← forecast tools</a>
    </div>
    <p class="msg">This page holds no data. It reads the private data repository with a GitHub token you enter here; by default the token is kept only while this page is open. Results are private pilot evidence: no rankings or "most accurate" claims.</p>
    <div class="row" style="gap:8px;flex-wrap:wrap;align-items:end">
      <div><label class="field-label" for="repo">Data repository</label><input class="input mono" id="repo" placeholder="WxMan33/forecast-ops-data"></div>
      <div style="flex:1;min-width:220px"><label class="field-label" for="tok">Fine-grained token (Contents: read, or read &amp; write for reviews)</label><input class="input mono" id="tok" type="password" autocomplete="off"></div>
      <div><label class="field-label" for="branch">Branch</label><input class="input mono" id="branch" placeholder="main" style="width:110px"></div>
      <div><label class="field-label" for="root">Data folder</label><input class="input mono" id="root" placeholder="(repo root)" style="width:130px"></div>
      <div><label class="field-label" for="tokMode">Keep token</label><select class="input" id="tokMode" style="width:auto">
        <option value="page">Only while this page is open</option>
        <option value="session">Until this tab closes</option>
        <option value="device">On this device (opt-in)</option></select></div>
      <button class="btn" id="load" type="button">LOAD</button>
      <button class="btn ghost" id="forget" type="button">FORGET TOKEN</button>
    </div>
    <p class="msg" id="msg"></p>
  </section>
  <div id="out"></div>
</main>
