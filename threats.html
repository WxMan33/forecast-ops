<body class="threats-page">
<main class="tx" id="tx">
  <div class="tx-demo noprint" id="txDemo" role="region" aria-label="Demo controls">
    <span class="tx-demo-badge" id="txBadge">LIVE PREVIEW</span>
    <span class="tx-demo-text" id="txBarText">Branch preview of official NWS and SPC feeds. Not for operational decisions.</span>
    <div class="tx-demo-ctl">
      <label class="tx-demo-field" id="dataField"><span>Data</span>
        <select class="input inline" id="demoScenario">
          <option value="live">Live official feeds</option>
          <optgroup label="Demo scenarios (fictional)">
          <option value="overlap">Overlapping threats</option>
          <option value="multi">Warnings in several regions</option>
          <option value="quiet">Quiet day</option>
          <option value="unavailable">Source outage</option>
          <option value="outage-expired">Outage, after warning expires</option>
          </optgroup>
          <optgroup label="Archived official samples (replayed)">
          <option value="archive-lox">NWS warning update, Los Angeles, Nov 19</option>
          <option value="archive-mtr">NWS tornado warning cancelled, Santa Cruz, Nov 16</option>
          <option value="archive-ww705">SPC Tornado Watch 705, Nov 12</option>
          <option value="archive-flood-day">Flash flood warning + WPC rainfall, Florida, Nov 20 midday</option>
          <option value="archive-flood-afternoon">Flash flood warning cut back, Florida, Nov 20 2:20 p.m.</option>
          <option value="archive-flood-outage">NWS outage while a flash flood warning expires, Nov 20</option>
          <option value="archive-flood-night">WPC rainfall Days 1–3, Florida, Nov 20 afternoon</option>
          <option value="archive-winter-advisory">Winter Weather Advisory, Utah, Nov 18 4 p.m.</option>
          <option value="archive-winter-warning">Upgrade to Winter Storm Warning, Utah, Nov 19 10 a.m.</option>
          <option value="archive-winter-outlook">WPC WSSI-P 7-day + Utah alerts, Nov 20 2:30 p.m.</option>
          <option value="archive-fire-day4">SPC fire outlook Day 4 (Critical), Northwest, Jul 29</option>
          <option value="archive-fire-day2">SPC fire outlook Day 2 (Extremely Critical), Jul 31</option>
          <option value="archive-fire-day1">SPC fire outlook Day 1, Aug 1</option>
          <option value="archive-fire-watch">Fire Weather Watch, Colorado, Nov 17 1 p.m.</option>
          <option value="archive-fire-warning">Upgrade to Red Flag Warning, Colorado, Nov 18</option>
          <option value="archive-fire-incidents">NIFC wildfire incidents (snapshot Nov 21)</option>
          <option value="archive-smoke-chicago">Smoke and Hazardous air, Chicago, Jul 16</option>
          <option value="archive-smoke-metlife">Smoke overhead, New York area, Jul 14</option>
          <option value="archive-smoke-forecast-0714">AirNow forecasts issued Jul 14</option>
          <option value="archive-smoke-forecast-0715">AirNow forecasts issued Jul 15</option>
          <option value="archive-tropical-watch">Hurricane Isaias watches, Alabama, Oct 7</option>
          <option value="archive-tropical-warning">Hurricane Isaias warnings, Alabama, Oct 8</option>
          <option value="archive-coastal-flagler">Coastal flood, surf and rip currents, NE Florida, Nov 21</option>
          <option value="archive-aviation-chicago">Airport weather (METAR/TAF), Chicago airports, Nov 22</option>
          <option value="archive-aviation-enroute">Aviation en route and FAA status (pilot reports, SIGMETs, G-AIRMETs, CWAs, delays), Nov 22</option>
          </optgroup>
        </select></label>
      <label class="tx-demo-field" id="venueField"><span>Venue</span>
        <select class="input inline" id="demoVenue"></select></label>
      <label class="tx-demo-field" id="stepField" hidden><span>Message</span>
        <select class="input inline" id="demoStep"></select></label>
    </div>
  </div>
  <div class="tx-body">
    <section class="tx-mapwrap" aria-label="Threat map">
      <div id="txMap" class="tx-map"></div>
      <div class="tx-top" id="txTop">
        <div class="tx-time" role="group" aria-label="Time">
          <button type="button" class="tx-tb" data-view="active" aria-pressed="true">Active now</button>
          <button type="button" class="tx-tb" data-view="day1" aria-pressed="false">Day 1</button>
          <button type="button" class="tx-tb" data-view="day2" aria-pressed="false">Day 2</button>
          <button type="button" class="tx-tb" data-view="day3" aria-pressed="false">Day 3</button>
          <button type="button" class="tx-tb" data-view="winter" aria-pressed="false">Winter · 7 days</button>
          <button type="button" class="tx-tb" data-view="fire" aria-pressed="false">Fire · 8 days</button>
        </div>
        <div class="tx-layers" role="group" aria-label="Layers">
          <button type="button" class="tx-lb" data-layer="severe" aria-pressed="true">Severe storms</button>
          <button type="button" class="tx-lb" data-layer="flood" aria-pressed="true">Flooding</button>
          <button type="button" class="tx-lb" data-layer="winter" aria-pressed="true">Winter</button>
          <button type="button" class="tx-lb" data-layer="fire" aria-pressed="true">Fire</button>
          <button type="button" class="tx-lb" data-layer="smoke" aria-pressed="true">Smoke &amp; air</button>
          <button type="button" class="tx-lb" data-layer="tropical" aria-pressed="true">Tropical</button>
          <button type="button" class="tx-lb" data-layer="coastal" aria-pressed="true">Coastal</button>
          <button type="button" class="tx-lb" data-layer="aviation" aria-pressed="true">Aviation</button>
        </div>
        <div class="tx-valid" id="txValid" aria-live="polite"></div>
        <div class="tx-model" id="txModel" hidden>
          <label class="tx-check"><input type="checkbox" id="modelChk"> Our research model</label>
          <div class="tx-hz" role="group" aria-label="Model hazard" id="modelHz" hidden>
            <button type="button" class="tx-hb" data-hz="tornado" aria-pressed="true">Tornado</button>
            <button type="button" class="tx-hb" data-hz="wind" aria-pressed="false">Wind</button>
            <button type="button" class="tx-hb" data-hz="hail" aria-pressed="false">Hail</button>
          </div>
        </div>
      </div>
      <div class="tx-mapchips" id="txChips"></div>
      <details class="tx-legend" id="txLegend">
        <summary>Legend</summary>
        <div id="txLegendBody"></div>
      </details>
    </section>
    <aside class="tx-panel" id="txPanel" data-sheet="open" aria-label="Threat details">
      <div class="tx-handle" id="txHandle">
        <span class="tx-grip" aria-hidden="true"></span>
        <button type="button" class="tx-peek" id="txPeek" aria-controls="txPanelBody"><span class="tx-peek1" id="txPeek1"></span><span class="tx-peek2" id="txPeek2"></span><span class="tx-peek3" id="txPeek3" hidden></span></button>
        <button type="button" class="tx-handle-act" id="txSheetBtn" aria-expanded="true" aria-controls="txPanelBody">Close</button>
      </div>
      <div class="tx-scope" role="group" aria-label="View">
        <button type="button" class="tx-sb" data-scope="national" aria-pressed="false">National</button>
        <button type="button" class="tx-sb" data-scope="venue" aria-pressed="true" id="scopeVenue">Venue</button>
      </div>
      <div class="tx-panel-body" id="txPanelBody" tabindex="-1"></div>
    </aside>
  </div>
</main>
