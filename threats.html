<body class="threats-page">
<main class="tx" id="tx">
  <div class="tx-demo noprint" id="txDemo" role="region" aria-label="Demo controls">
    <span class="tx-demo-badge" id="txBadge">LIVE PREVIEW</span>
    <span class="tx-demo-text" id="txBarText">Branch preview of official NWS and SPC feeds. Not for operational decisions.</span>
    <div class="tx-demo-ctl">
      <label class="tx-demo-field"><span>Data</span>
        <select class="input inline" id="demoScenario">
          <option value="live">Live official feeds</option>
          <optgroup label="Demo scenarios (fictional)">
          <option value="overlap">Overlapping threats</option>
          <option value="multi">Warnings in several regions</option>
          <option value="quiet">Quiet day</option>
          <option value="unavailable">Source outage</option>
          <option value="outage-expired">Outage, after warning expires</option>
          </optgroup>
        </select></label>
      <label class="tx-demo-field"><span>Venue</span>
        <select class="input inline" id="demoVenue"></select></label>
    </div>
  </div>
  <div class="tx-body">
    <section class="tx-mapwrap" aria-label="Threat map">
      <div id="txMap" class="tx-map"></div>
      <div class="tx-top" id="txTop">
        <div class="tx-time" role="group" aria-label="Time">
          <button type="button" class="tx-tb" data-view="active" aria-pressed="true">Active now</button>
          <button type="button" class="tx-tb" data-view="day1" aria-pressed="false">Day 1</button>
          <button type="button" class="tx-tb" data-view="day2" aria-pressed="false">Day 2</button>
        </div>
        <div class="tx-valid" id="txValid" aria-live="polite"></div>
        <div class="tx-model" id="txModel" hidden>
          <label class="tx-check"><input type="checkbox" id="modelChk"> Our research model</label>
          <div class="tx-hz" role="group" aria-label="Model hazard" id="modelHz" hidden>
            <button type="button" class="tx-hb" data-hz="tornado" aria-pressed="true">Tornado</button>
            <button type="button" class="tx-hb" data-hz="wind" aria-pressed="false">Wind</button>
            <button type="button" class="tx-hb" data-hz="hail" aria-pressed="false">Hail</button>
          </div>
        </div>
      </div>
      <div class="tx-mapchips" id="txChips"></div>
      <details class="tx-legend" id="txLegend">
        <summary>Legend</summary>
        <div id="txLegendBody"></div>
      </details>
    </section>
    <aside class="tx-panel" id="txPanel" data-sheet="open" aria-label="Threat details">
      <div class="tx-handle" id="txHandle">
        <span class="tx-grip" aria-hidden="true"></span>
        <button type="button" class="tx-peek" id="txPeek" aria-controls="txPanelBody"><span class="tx-peek1" id="txPeek1"></span><span class="tx-peek2" id="txPeek2"></span><span class="tx-peek3" id="txPeek3" hidden></span></button>
        <button type="button" class="tx-handle-act" id="txSheetBtn" aria-expanded="true" aria-controls="txPanelBody">Close</button>
      </div>
      <div class="tx-scope" role="group" aria-label="View">
        <button type="button" class="tx-sb" data-scope="national" aria-pressed="false">National</button>
        <button type="button" class="tx-sb" data-scope="venue" aria-pressed="true" id="scopeVenue">Venue</button>
      </div>
      <div class="tx-panel-body" id="txPanelBody" tabindex="-1"></div>
    </aside>
  </div>
</main>
